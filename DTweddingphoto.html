    <script>
        // 轮播图模拟
        let currentSlide = 0;
        const slides = document.querySelectorAll('.swiper-slide');
        const dots = document.querySelectorAll('.swiper-dot');

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlide();
        }

        function updateSlide() {
            slides.forEach((slide, index) => {
                slide.style.display = index === currentSlide ? 'block' : 'none';
            });
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }

        // 初始化轮播图
        slides.forEach((slide, index) => {
            if (index !== 0) {
                slide.style.display = 'none';
            }
        });

        // 自动轮播
        setInterval(nextSlide, 3000);

        // 轮播功能函数
        function initSlider(sliderIndex) {
            const sliders = document.querySelectorAll('.featured-slider');
            const slider = sliders[sliderIndex];
            const images = slider.querySelectorAll('.featured-img');
            let currentImage = 0;

            // 初始显示第一张图片
            if (images.length > 0) {
                images[0].classList.add('active');
            }

            function nextImage() {
                // 隐藏当前图片
                images[currentImage].classList.remove('active');
                // 切换到下一张图片
                currentImage = (currentImage + 1) % images.length;
                // 显示新图片
                images[currentImage].classList.add('active');
            }

            // 每隔3秒切换一次
            setInterval(nextImage, 3000);
        }

        // 初始化所有轮播
        for (let i = 0; i < document.querySelectorAll('.featured-slider').length; i++) {
            initSlider(i);
        }
    </script>
